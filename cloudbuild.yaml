# Cloud Build: auto-deploy BDI Daily ke Cloud Run setiap push ke GitHub
# Cara pakai: hubungkan repo ini di Cloud Console > Cloud Build > Triggers
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bdi-daily:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bdi-daily:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bdi-daily'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bdi-daily:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'

options:
  logging: CLOUD_LOGGING_ONLY
